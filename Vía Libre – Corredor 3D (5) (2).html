    $('score').textContent=Math.floor(score);$('coins').textContent='● '+coins;$('mult').textContent=mult>1?'x'+mult:'';$('pu').textContent=(jet>0?'🚀 '+Math.ceil(jet)+'s  ':'')+(mag>0?'🧲 '+Math.ceil(mag)+'s  ':'')+(shield?'🛡️':'');$('rush').className=playing&&rush>0?'on'+(rush>37?' big':''):'';if(rush>0){$('rt').textContent=Math.ceil(rush);$('rb').firstChild.style.width=(rush/40*100)+'%'}
  }
  if(state!=='over'){
    t+=dt*(6+sp*.25);
    const sw=py>gh+.05?.5:Math.sin(t)*.9;

    if(state!=='dying'){player.rotation.x=slide>0?1.15:0;if(slide>0)player.position.y+=.4}
    player.rotation.z=(laneX(lane)-px)*-.15;torso.rotation.x=state==='dying'?0:.14;head.rotation.x=Math.sin(t*2)*.03;shadow.position.x=px;shadow.scale.setScalar(Math.max(.4,1-py*.25));shadow.visible=false;
  }
  const sh=state==='dying'?rnd(-.15,.15):0;
  if(state==='menu'){const q=Math.sin(performance.now()/4000);cam.position.set(2.6+q*.8,1.9,4.6);cam.lookAt(0,1.25,0);cam.rotation.z=0}else{camY+=(Math.min(py,3.6)*.8-camY)*Math.min(1,dt*4);cam.position.set(px*.6+sh,5.3+sh+camY,8.6);cam.lookAt(px*.3,1.6+camY*.9,-8);cam.rotation.z=-(laneX(lane)-px)*.02}
  cam.fov=(innerWidth<innerHeight?75:62)+(playing?(speed-14)*.15:0);cam.updateProjectionMatrix();shMesh.visible=shield;upParts(dt,d);warnMat.opacity=.55+.45*Math.sin(performance.now()/80);adapt(dt);renderer.render(scene,cam);
