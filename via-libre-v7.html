function pause(){if(state!=='play')return;state='pause';$('title').textContent='PAUSA';$('tag').textContent='Respira un segundo';$('go').textContent='Continuar';$('res').classList.add('hide');$('ov').classList.remove('hide')}
function resume(){state='play';$('ov').classList.add('hide')}
$('go').onclick=()=>state==='pause'?resume():start();$('pb').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function act(a){
  if(state!=='play')return;
  if(a==='L')lane=Math.max(-1,lane-1);if(a==='R')lane=Math.min(1,lane+1);
  if(a==='U'&&py<.05){vy=10.5;slide=0;snd(300,.15,'sine',.08,620)}
  if(a==='D'){slide=.7;if(py>.05)vy=-16}
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),m={arrowleft:'L',a:'L',arrowright:'R',d:'R',arrowup:'U',w:'U',' ':'U',arrowdown:'D',s:'D'}[k];
  if(k==='p'||k==='escape'){state==='play'?pause():state==='pause'&&resume()}
  if(m){e.preventDefault();act(m)}
  if((k==='enter'||k===' ')&&(state==='menu'||state==='over')&&document.activeElement!==$('go'))start();
});
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;act(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?75:62;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05),playing=state==='play';
  const sp=playing?speed:state==='menu'?9:state==='dying'?speed*Math.max(0,dying/.9)*.6:0,d=sp*dt;
  loops.forEach(o=>{o.m.position.z+=d;if(o.m.position.z>14)o.m.position.z-=o.len});
  if(playing||state==='dying'){
    if(playing){
      mult=1+Math.floor(dist/400);score+=d*mult;speed=Math.min(40,speed+.3*dt);dist+=d;
      px+=(laneX(lane)-px)*Math.min(1,dt*14);
      vy-=28*dt;py+=vy*dt;if(py<=0){py=0;vy=0}
      slide=Math.max(0,slide-dt);mag=Math.max(0,mag-dt);acc+=d;
      if(acc>=gap){acc=0;gap=rnd(16,22)+speed*.25;spawnRow(SPAWN_Z)}
    }else{dying-=dt;player.rotation.x=-Math.min(1.4,(.9-dying)*3);if(dying<=0)over()}
    const ph=slide>0?.7:1.8;
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];o.z+=d+o.ex*dt;o.m.position.z=o.z;if(o.warn){o.warn.visible=o.z>-75;if(!o.hn&&o.z>-100){o.hn=1;snd(196,.8,'sawtooth',.05);snd(247,.8,'sawtooth',.04)}}
      if(playing&&Math.abs(o.z)<o.hl+.35&&Math.abs(px-laneX(o.l))<1.15&&py+.1<o.y1&&py+ph>o.y0){if(shield){shield=false;o.m.visible=false;o.y0=9;o.y1=10;snd(500,.25,'triangle',.08,180);burst(px,1.2,0,'#4aa8ff',30,6);continue}die();continue}
      if(o.z>14){scene.remove(o.m);obstacles.splice(i,1)}
    }
    for(let i=coinsArr.length-1;i>=0;i--){
      const c=coinsArr[i];c.z+=d;c.m.position.z=c.z;c.m.rotation.y+=dt*5;if(mag>0&&c.z>-22&&c.z<4){const k=Math.min(1,dt*9);c.m.position.x+=(px-c.m.position.x)*k;c.y+=(1-c.y)*k;c.m.position.y=c.y}
      if(playing&&Math.abs(c.z)<.9&&Math.abs(px-c.m.position.x)<1.1&&py<c.y+.5&&py+ph>c.y-.4){coins++;score+=10*mult;burst(c.m.position.x,c.y,0,'#ffd21f',8,3);snd(880,.12,'square',.04,1320);scene.remove(c.m);coinsArr.splice(i,1);continue}
      if(c.z>12){scene.remove(c.m);coinsArr.splice(i,1)}
    }
    for(let i=pups.length-1;i>=0;i--){const u=pups[i];u.z+=d;u.m.position.z=u.z;u.m.rotation.y+=dt*3;u.m.position.y=1.2+Math.sin(performance.now()/250)*.12;
      if(playing&&Math.abs(u.z)<.9&&Math.abs(px-laneX(u.l))<1.1&&py<1.8){if(u.t==='mag')mag=8;else shield=true;snd(660,.25,'triangle',.07,990);burst(laneX(u.l),1.2,0,'#4aa8ff',16,4);scene.remove(u.m);pups.splice(i,1);continue}
      if(u.z>12){scene.remove(u.m);pups.splice(i,1)}}
    if(playing&&py<.05&&Math.random()<dt*25)burst(px+rnd(-.2,.2),.05,.3,'#d9cdb8',1,.6);
    $('score').textContent=Math.floor(score);$('coins').textContent='● '+coins;$('mult').textContent=mult>1?'x'+mult:'';$('pu').textContent=(mag>0?'🧲 '+Math.ceil(mag)+'s  ':'')+(shield?'🛡️':'');
  }
  if(state!=='over'){
    t+=dt*(6+sp*.25);
    const sw=py>.05?.5:Math.sin(t)*.9;
    legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw;armR.rotation.x=sw;
    player.position.set(px,py+(py>.05||state==='dying'?0:Math.abs(Math.sin(t))*.06),0);
    if(state!=='dying'){player.rotation.x=slide>0?1.15:0;if(slide>0)player.position.y+=.4}
    player.rotation.z=(laneX(lane)-px)*-.15;torso.rotation.x=state==='dying'?0:.14;head.rotation.x=Math.sin(t*2)*.03;shadow.position.x=px;shadow.scale.setScalar(Math.max(.4,1-py*.25));shadow.visible=false;
  }
  const sh=state==='dying'?rnd(-.15,.15):0;
  if(state==='menu'){const q=Math.sin(performance.now()/4000);cam.position.set(2.6+q*.8,1.9,4.6);cam.lookAt(0,1.25,0);cam.rotation.z=0}else{cam.position.set(px*.6+sh,5.3+sh,8.6);cam.lookAt(px*.3,1.6,-8);cam.rotation.z=-(laneX(lane)-px)*.02}
  cam.fov=(innerWidth<innerHeight?75:62)+(playing?(speed-14)*.15:0);cam.updateProjectionMatrix();shMesh.visible=shield;upParts(dt,d);warnMat.opacity=.55+.45*Math.sin(performance.now()/80);renderer.render(scene,cam);
}
frame();
</script>
</body>
</html>
